<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Me</title>

  <style>
    body{
      margin:0;
      padding:0;
      font-family:"Poppins",sans-serif;
      background:#f5f5f5;
    }

    .contact-section{
      padding:80px 0;
      max-width:1100px;
      margin:auto;
      padding-left:20px;
      padding-right:20px;
    }

    .contact-title{
      text-align:center;
      font-size:38px;
      font-weight:600;
      margin-bottom:10px;
    }

    .contact-title span{
      color:#007bff;
    }

    .contact-subtitle{
      text-align:center;
      color:#555;
      margin-bottom:50px;
    }

    .contact-container{
      display:flex;
      flex-wrap:wrap;
      gap:40px;
      align-items:flex-start;
    }

    .contact-info{
      flex:1;
      min-width:300px;
      color:#333;
      font-size:16px;
    }

    .contact-info p{
      margin:10px 0;
    }

    .contact-info strong{
      color:#000;
    }

    form{
      flex:1;
      min-width:320px;
      background:#fff;
      padding:30px;
      border-radius:10px;
      border:1px solid #ddd;
      box-shadow:0 8px 25px rgba(0,0,0,0.08);
    }

    input, textarea{
      width:100%;
      padding:12px;
      margin-bottom:18px;
      border-radius:6px;
      border:1px solid #ccc;
      font-size:15px;
      outline:none;
    }

    button{
      width:100%;
      padding:12px;
      background:#007bff;
      border:none;
      color:#fff;
      font-weight:600;
      font-size:16px;
      border-radius:6px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#0056b3;
    }
  </style>

</head>
<body>

  <section class="contact-section" id="contact">
    <h2 class="contact-title">Contact <span>Me</span></h2>
    <p class="contact-subtitle">Feel free to message me anytime 😊</p>

    <div class="contact-container">

      <!-- LEFT SIDE INFO -->
      <div class="contact-info">
        <p><strong>📧 Email:</strong> yourmail@gmail.com</p>
        <p><strong>📞 Phone:</strong> +92 xxx xxx xxxx</p>
        <p><strong>📍 Location:</strong> Pakistan</p>
        <br>
        <p>
          I am available for freelance projects and collaborations.
        </p>
      </div>

      <!-- CONTACT FORM (Web3Forms Connected) -->
      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="718a1ed2-1207-40fe-a726-0dcb1ca32b3f">

        <input type="text" name="name" placeholder="Your Name" required>
        <input type="email" name="email" placeholder="Your Email" required>
        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>

        <button type="submit">Send Message</button>
      </form>

    </div>
  </section>

</body>
</html>
